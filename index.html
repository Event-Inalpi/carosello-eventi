/* ===== pagina 3840 x 2160 (si scala solo per entrare nella finestra; a 3840x2160 e' 1:1) ===== */
#screen{position:absolute;left:50%;top:50%;width:3840px;height:2160px;background:#000;
  transform-origin:50% 50%;font-family:'Bebas Neue','Arial Narrow',sans-serif}
#screen.nofit{left:0;top:0;transform:none}
/* elementi fissi dello sfondo "03", sopra il carosello: bordi netti e fermi */
.fx{position:absolute;display:block}
#ll{left:0;top:271px;width:960px;height:1649px}
#logo{left:1920px;top:0;width:960px;height:642px}
/* coperture nere ferme: tagliano il carosello al posto di overflow:hidden (che sul livello animato fa tremare l'ultima riga) */
.mask{position:absolute;background:#000}

/* ===== le 3 aree del carosello: 960x1920 | 960x1920 | 960x1344 ===== */
.vp{position:absolute}                                 /* nessun clip: il taglio lo fanno le coperture .mask */
#vp1{left:0;top:0;width:960px;height:271px}          /* sopra Live Lounge (che parte a y=271) */
#vp2{left:960px;top:0;width:960px;height:1920px}
#vp3{left:1920px;top:642px;width:960px;height:702px} /* sotto il logo Inalpi Arena (che finisce a y=641) */

/* la colonna continua e' alta 5184 = 1344 (area 3) + 1920 (area 2) + 1920 (area 1); l'area 3 e' la parte alta.
   Lo "stage" 960x2900 parte a y=669 della colonna continua: in ogni area viene spostato di conseguenza. */
.stage{position:absolute;left:0;width:960px;height:2900px;background:#000}
#vp1 .stage{top:-2595px}      /* 669 - 3264 */
#vp2 .stage{top:-675px}       /* 669 - 1344 */
#vp3 .stage{top:27px}         /* 669 - 642  */

.title{position:absolute;left:0;right:0;top:calc(123px - .85em);font:700 81.3px/1 'Poppins Bold','Poppins',sans-serif;
  color:#fff;text-align:center;white-space:nowrap}
.win{position:absolute;left:0;top:230px;width:960px;height:2440px;overflow:hidden}
.empty{color:#888;text-align:center;font-size:48px;letter-spacing:.08em;padding-top:300px;margin:0}
.track{will-change:transform;backface-visibility:hidden}

/* ===== riquadro: 850 x 643 px, passo 711 px ===== */
.card{position:relative;width:850px;height:643px;margin:0 0 68px 55px;background:#000;color:#fff;overflow:hidden;container-type:inline-size;--a:#0a6fc2}
.stripe-l{position:absolute;left:0;top:0;bottom:0;width:1.65cqw;background:var(--a)}
.stripe-b{position:absolute;left:0;right:0;bottom:0;height:4.6cqw;background:var(--a)}
.head{position:absolute;left:0;right:0;top:0;height:13.4cqw;display:flex;align-items:stretch}
.head::after{content:'';flex:1 1 0;min-width:0}
.head .bar{flex:1 1 0;min-width:0;background:var(--a)}
.dbox,.mese{flex:none}
.dbox{display:flex;align-items:center;justify-content:center;padding:0 1.8cqw;border:.55cqw solid #fff;background:#000;
  font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:400;font-size:11.6cqw;line-height:1;white-space:nowrap;padding-top:.1em}
.mese{display:flex;align-items:center;gap:1.8cqw;margin-left:2.4cqw;white-space:nowrap;line-height:1}
.mese b{font-family:'Poppins Bold','Poppins',sans-serif;font-weight:700;font-size:6.4cqw;text-transform:uppercase}
.mese span{font-family:'Bebas Neue Book','Bebas Neue',sans-serif;font-weight:400;font-size:7cqw;position:relative;top:.05em}
.img{position:absolute;left:1.65cqw;right:.12cqw;top:13.4cqw;height:57.6cqw;background:#111;overflow:hidden}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.img img.err{display:none}
.ph{width:100%;height:100%;background:linear-gradient(145deg,#000,var(--a))}

/* ===== guida (solo con ?guida=1): aree del carosello in rosso e linee di divisione ===== */
#guide{position:absolute;inset:0;pointer-events:none;display:none}
#guide i{position:absolute;background:rgba(255,0,0,.45);outline:2px solid #fff}
body.guida #guide{display:block}
</style>

<script>
const Q=new URLSearchParams(location.search);
const DUR=+Q.get('durata')||210;                 // secondi per un giro completo dell'elenco (3:30)
const PITCH=711, WINH=2440;                      // passo tra i riquadri e altezza della finestra di scorrimento (px)
if(Q.get('guida')!==null) document.body.classList.add('guida');

/* ===== DATI DI ESEMPIO (usati solo se events.json non risponde) ===== */
const rg=(a,b)=>{const o=[];for(let x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');x<=y;x.setDate(x.getDate()+1))o.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'));return o};
const mk=(title,accent,dates,image)=>dates.map(date=>({title,accent,date,image}));
const EVENTS=[].concat(
  mk('Laura Pausini','#1d5fa8',rg('2026-10-17','2026-10-18'),'https://networksites.livenationinternational.com/networksites/jq3mi5lz/torino.jpg?format=webp&width=1920&quality=75'),
  mk('Achille Lauro','#0a6fc2',['2026-11-12']),
  mk('It All Adds Up To This','#1a8fd1',rg('2026-11-15','2026-11-21')),
  mk('Notre Dame de Paris','#c9a14a',rg('2026-12-04','2026-12-07')),
  mk('Cremonini','#d9531e',['2026-12-09','2026-12-10','2026-12-12']),
  mk('ANNA','#ff4fa0',['2026-12-15'],'https://networksites.livenationinternational.com/networksites/qcqltzyq/anna_26_fb_event_local.jpg?format=webp&width=1920&quality=75'),
  mk('Il Volo','#8c7a4a',['2026-12-19'],'https://networksites.livenationinternational.com/networksites/dbsldnmj/il-volo-christmas-night-2026.jpg?format=webp&width=1920&quality=75'),
  mk('Irama','#e0261f',['2026-12-21']),
  mk('Gigi','#0a6fc2',['2026-12-23']),
  mk('Ted Ryan','#d9a21e',['2027-01-26']),
  mk('Sfera Ebbasta','#e0261f',['2027-01-30']),
  mk('LBA Final Eight','#2fa84f',rg('2027-02-17','2027-02-21')),
  mk('Gabry Ponte','#7a3cff',['2027-03-06']),
  mk('Max Forever','#e0a31f',['2027-03-09','2027-03-11','2027-03-13','2027-03-14']),
  mk('La Zanzara Show','#2fa84f',['2027-03-20']),
  mk('Antonello Venditti','#c96a1e',['2027-04-09']),
  mk('GiannaGold','#d4b23c',['2027-04-11']),

/* ===== LOGICA ===== */
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d=s=>new Date(s+'T00:00:00');

// Raggruppa le date dello stesso evento (titolo + copertina + mese/anno) in un unico riquadro
function group(rows){
  const m=new Map();
  rows.forEach(r=>{
    const dt=d(r.date), k=[r.title,r.image||'',dt.getFullYear(),dt.getMonth()].join('|');
    if(!m.has(k)) m.set(k,{title:r.title,image:r.image,accent:r.accent,days:new Set(),first:dt});
    const g=m.get(k); g.days.add(dt.getDate()); if(dt<g.first) g.first=dt;
  });
  return [...m.values()].map(g=>({...g,days:[...g.days].sort((a,b)=>a-b)})).sort((a,b)=>a.first-b.first);
}
// 1 giorno -> "9"; tutti consecutivi -> "4 - 7"; misti/alternati -> "9, 10, 12"
function dayLabel(days){
  if(days.length===1) return String(days[0]);
  return days.every((x,i)=>i===0||x===days[i-1]+1) ? days[0]+' - '+days[days.length-1] : days.join(', ');
}
function cardHTML(g){
  const media=`<div class="ph"></div>`+(g.image
    ? `<img src="${esc(g.image)}" alt="${esc(g.title)}" referrerpolicy="no-referrer" onerror="this.classList.add('err')">` : '');
  return `<article class="card" style="--a:${esc(g.accent||'#0a6fc2')}">
    <i class="stripe-l"></i><i class="stripe-b"></i>
    <div class="head"><div class="bar"></div>
      <div class="dbox">${esc(dayLabel(g.days))}</div>
      <div class="mese"><b>${MESI[g.first.getMonth()]}</b><span>${g.first.getFullYear()}</span></div>
    </div>
    <div class="img">${media}</div>
  </article>`;
}
// i numeri restano grandi; si riducono solo se il blocco data non entra nel riquadro
function fit(card){
  const db=card.querySelector('.dbox'), me=card.querySelector('.mese'), ml=parseFloat(getComputedStyle(me).marginLeft)||0;
  const room=card.clientWidth-2*0.02*card.clientWidth;
  let size=11.6; while(size>4 && db.offsetWidth+ml+me.offsetWidth>room){size-=0.3; db.style.fontSize=size+'cqw';}
}

/* ===== COLONNA: un'unica animazione mostrata nelle 3 aree, sincronizzate al fotogramma ===== */
const stages=[...document.querySelectorAll('.stage')];
const T0=document.timeline.currentTime;      // origine comune: le tre animazioni partono dallo stesso istante
let lastKey=null, anims=[];
function build(list){
  anims.forEach(a=>a.cancel()); anims=[];
  if(!list.length){stages.forEach(s=>s.innerHTML='<div class="title">COMING SOON...</div><p class="empty">Nessun evento in programma</p>');return}
  const k=Math.max(1,Math.ceil(WINH/(list.length*PITCH)));        // pochi eventi: ripete l'elenco per riempire la finestra
  const title=Q.get('titolo')!==null?esc(Q.get('titolo')):'COMING SOON...';
  const first=stages[0];
  first.innerHTML=`<div class="title">${title}</div><div class="win"><div class="track">${list.map(cardHTML).join('').repeat(k)}</div></div>`;
  first.querySelectorAll('.card').forEach(fit);
  const track=first.querySelector('.track'), period=list.length*k*PITCH;   // altezza esatta di un giro (intero: nessun salto)
  track.insertAdjacentHTML('beforeend',track.innerHTML);          // copia identica in coda: a fine giro si riparte senza stacchi
  const html=first.innerHTML;
  stages.slice(1).forEach(s=>s.innerHTML=html);                   // stessa colonna nelle altre due aree
  stages.forEach(s=>{
    const a=s.querySelector('.track').animate([{transform:'translate3d(0,0,0)'},{transform:`translate3d(0,${-period}px,0)`}],
      {duration:DUR*1000,iterations:Infinity,easing:'linear'});
    a.startTime=T0; anims.push(a);
  });
}
function render(events){
  const today=new Date(); today.setHours(0,0,0,0);
  const list=group(events.filter(e=>d(e.date)>=today)), key=JSON.stringify(list.map(g=>[g.title,g.image,g.accent,g.days,+g.first]));
  if(key!==lastKey){lastKey=key; build(list)}                     // ridisegna solo se qualcosa e' cambiato
}
async function load(){
  try{
    const r=await fetch('events.json',{cache:'no-store'}); if(!r.ok) throw 0;
    render(await r.json());
  }catch(e){ if(lastKey===null) render(EVENTS) }                  // aperto senza dati: esempio
}

/* ===== adattamento alla finestra (a 3840x2160 reali la scala e' 1) ===== */
const screenEl=document.getElementById('screen');
function fitScreen(){ if(Q.get('fit')==='0'){screenEl.classList.add('nofit');return}
  screenEl.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/3840,innerHeight/2160)})`; }
addEventListener('resize',fitScreen); fitScreen();

Promise.all([document.fonts.load("100px 'Bebas Neue'"),document.fonts.load("700 100px 'Poppins Bold'")]).catch(()=>{}).then(()=>{
  load(); setInterval(load,5*60*1000);
});
