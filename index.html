/* Anno: se arriva Bebas Neue Pro Book, aggiungere un @font-face 'Bebas Neue Book' (il fallback è Bebas Neue Regular). */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#0b0b0b;display:flex;justify-content:center;font-family:'Bebas Neue','Arial Narrow',Arial,sans-serif}

/* ---- contenitore colonna ---- */
.column{--w:380px;width:min(var(--w),100%);height:100%;overflow:hidden;position:relative;container-type:inline-size;
  -webkit-mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(transparent,#000 6%,#000 94%,transparent)}

.empty{color:#888;text-align:center;font:400 4.5cqw 'Bebas Neue',sans-serif;letter-spacing:.08em;padding-top:30%}
.track{animation:scroll linear infinite;will-change:transform}
.column:hover .track{animation-play-state:paused}
@keyframes scroll{to{transform:translateY(calc(-1 * var(--dist)))}}
@media (prefers-reduced-motion:reduce){.track{animation:none}.column{overflow-y:auto}}

/* ---- riquadro (progettato su 500x378, tutto in cqw così scala) ---- */
.card{position:relative;aspect-ratio:500/378;background:#000;color:#fff;overflow:hidden;container-type:inline-size;margin-bottom:3cqw;--a:#0a6fc2}
.stripe-l{position:absolute;left:0;top:0;bottom:0;width:2cqw;background:var(--a)}
.stripe-b{position:absolute;left:0;right:0;bottom:0;height:4.6cqw;background:var(--a)}
.head{position:absolute;left:0;right:0;top:0;height:13.4cqw;display:flex;align-items:stretch}
.head::after{content:'';flex:1 1 0;min-width:0}
.dbox,.mese{flex:none}
.head .bar{flex:1 1 0;min-width:0;background:var(--a)}
.dbox{display:flex;align-items:center;justify-content:center;padding:0 1.8cqw;border:.55cqw solid #fff;background:#000;font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:400;font-size:11.6cqw;line-height:1;white-space:nowrap;padding-top:.1em}
.dbox.long{font-size:8.8cqw}
.dbox.xlong{font-size:6.6cqw}
.dbox.xxlong{font-size:5.2cqw}
.mese{display:flex;align-items:center;gap:1.8cqw;margin-left:2.4cqw;white-space:nowrap;line-height:1}
.mese b{font-family:'Poppins Bold','Poppins',sans-serif;font-weight:700;font-size:6.4cqw;text-transform:uppercase}
.mese span{font-family:'Bebas Neue Book','Bebas Neue',sans-serif;font-weight:400;font-size:7cqw;position:relative;top:.05em}
.img{position:absolute;left:2cqw;right:1.2cqw;top:15cqw;height:56cqw;background:#111;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;background:linear-gradient(145deg,#000,var(--a))}
.img img{position:absolute;inset:0}
.img img.err{display:none}
</style>
</head>
<body>
<div class="column" id="col"></div>

<script>
/* ===== DATI =====
   Un record per ogni DATA, come nell'elenco del sito: { title, date:'YYYY-MM-DD', image?:url, accent?:'#hex' }
   Il componente raggruppa da solo le date dello stesso evento (stesso titolo + stessa copertina + stesso mese).
   Questi sono solo dati di esempio (fallback se events.json non risponde): i dati veri li fornisce scripts/scrape.js. Qui: segnaposto ricavati dalla tua colonna. */
const rg=(a,b)=>{const o=[];for(let x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');x<=y;x.setDate(x.getDate()+1))o.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'));return o};
const mk=(title,accent,dates,image)=>dates.map(date=>({title,accent,date,image}));
const EVENTS=[].concat(
  mk('Laura Pausini','#1d5fa8',rg('2026-10-17','2026-10-18'),'https://networksites.livenationinternational.com/networksites/jq3mi5lz/torino.jpg?format=webp&width=1920&quality=75'),
  mk('Achille Lauro','#0a6fc2',['2026-11-12']),
  mk('It All Adds Up To This','#1a8fd1',rg('2026-11-15','2026-11-21')),
  mk('Notre Dame de Paris','#c9a14a',rg('2026-12-04','2026-12-07')),
  mk('Cremonini','#d9531e',['2026-12-09','2026-12-10','2026-12-12']),
  mk('ANNA','#ff4fa0',['2026-12-15'],'https://networksites.livenationinternational.com/networksites/qcqltzyq/anna_26_fb_event_local.jpg?format=webp&width=1920&quality=75'),
  mk('Il Volo','#8c7a4a',['2026-12-19'],'https://networksites.livenationinternational.com/networksites/dbsldnmj/il-volo-christmas-night-2026.jpg?format=webp&width=1920&quality=75'),
  mk('Irama','#e0261f',['2026-12-21']),
  mk('Gigi','#0a6fc2',['2026-12-23']),
  mk('Ted Ryan','#d9a21e',['2027-01-26']),
  mk('Sfera Ebbasta','#e0261f',['2027-01-30']),
  mk('LBA Final Eight','#2fa84f',rg('2027-02-17','2027-02-21')),
  mk('Gabry Ponte','#7a3cff',['2027-03-06']),
  mk('Max Forever','#e0a31f',['2027-03-09','2027-03-11','2027-03-13','2027-03-14']),
  mk('La Zanzara Show','#2fa84f',['2027-03-20']),
  mk('Antonello Venditti','#c96a1e',['2027-04-09']),
  mk('GiannaGold','#d4b23c',['2027-04-11']),
  mk('Eros','#c9302c',['2027-05-15'])
);

/* ===== LOGICA ===== */
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d=s=>new Date(s+'T00:00:00');

// Raggruppa le date dello stesso evento (titolo + copertina + mese/anno) in un unico riquadro
function group(rows){
  const m=new Map();
  rows.forEach(r=>{
    const dt=d(r.date), k=[r.title,r.image||'',dt.getFullYear(),dt.getMonth()].join('|');
    if(!m.has(k)) m.set(k,{title:r.title,image:r.image,accent:r.accent,days:new Set(),first:dt});
    const g=m.get(k); g.days.add(dt.getDate()); if(dt<g.first) g.first=dt;
  });
  return [...m.values()].map(g=>({...g,days:[...g.days].sort((a,b)=>a-b)})).sort((a,b)=>a.first-b.first);
}

// Etichetta giorni: 1 giorno -> "9"; tutti consecutivi -> "4 - 7"; misti/alternati -> "9, 10, 12"
function dayLabel(days){
  if(days.length===1) return String(days[0]);
  const consecutive=days.every((x,i)=>i===0||x===days[i-1]+1);
  return consecutive ? days[0]+' - '+days[days.length-1] : days.join(', ');
}

// L'URL dell'immagine si usa esattamente com'è (indirizzo completo, parametri inclusi)
const imgSrc=u=>u;

function cardHTML(g){
  const lab=dayLabel(g.days), n=lab.length;
  const cls=n<=3?'':n<=9?' long':n<=16?' xlong':' xxlong';
  const media=`<div class="ph"></div>`+(g.image
    ? `<img src="${esc(imgSrc(g.image))}" alt="${esc(g.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add('err')">`
    : '');
  return `<article class="card" style="--a:${esc(g.accent||'#0a6fc2')}">
    <i class="stripe-l"></i><i class="stripe-b"></i>
    <div class="head"><div class="bar"></div>
      <div class="dbox${cls}">${esc(lab)}</div>
      <div class="mese"><b>${MESI[g.first.getMonth()]}</b><span>${g.first.getFullYear()}</span></div>
    </div>
    <div class="img">${media}</div>
  </article>`;
}

function createColumn(root,{speed=40}={}){
  let list=[], to;
  const build=()=>{
    if(!list.length){root.innerHTML='<p class="empty">Nessun evento in programma</p>';return}
    root.innerHTML='<div class="track"></div>';
    const t=root.firstChild, set=list.map(cardHTML).join('');
    t.innerHTML=set;
    let h=t.scrollHeight, guard=0;
    while(h<root.clientHeight && guard++<20){t.insertAdjacentHTML('beforeend',set); h=t.scrollHeight;}
    t.insertAdjacentHTML('beforeend',t.innerHTML);
    t.style.setProperty('--dist',h+'px');
    t.style.animationDuration=(h/speed)+'s';
  };
  addEventListener('resize',()=>{clearTimeout(to);to=setTimeout(build,200)});
  return events=>{                                       // scarta le date passate, poi raggruppa
    const today=new Date(); today.setHours(0,0,0,0);
    list=group(events.filter(e=>d(e.date)>=today)); build();
  };
}

const col=document.getElementById('col'), render=createColumn(col,{speed:40});
let last=null;
async function load(){
  try{
    const r=await fetch('events.json',{cache:'no-store'}); if(!r.ok) throw 0;
    const ev=await r.json(), key=JSON.stringify(ev);
    if(key!==last){last=key; render(ev)}                 // ridisegna solo se i dati sono cambiati
  }catch(e){ if(last===null){last='demo'; render(EVENTS)} }   // aperto senza server: dati di esempio
}
load(); setInterval(load,5*60*1000);
</script>
</body>
</html>
